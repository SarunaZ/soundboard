# node-modules linker, NOT Yarn's default PnP.
# React Native / Metro and better-sqlite3's native build both expect a real
# node_modules tree; PnP breaks Expo. Do not change this without testing the app.
nodeLinker: node-modules

# Keep the cache global (outside the repo) — the Dockerfile mounts its own.
enableGlobalCache: true

# Yarn quarantines npm versions published in the last few days (supply-chain
# guard). The Expo/RN tree releases constantly and is always inside that window,
# so it is exempted by name — the gate still protects everything else, which is
# the point. Do NOT widen these globs to cover the service's dependencies.
npmPreapprovedPackages:
  - "expo"
  - "expo-*"
  - "@expo/*"
  - "babel-preset-expo"
  - "metro"
  - "metro-*"
  - "react"
  - "react-dom"
  - "react-native"
  - "react-native-*"
  - "@react-native/*"
  - "@react-native-community/*"
